<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Finanças</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #F8FAFC; min-height: 100vh; }

  /* HEADER */
  .header { background: #1E293B; padding: 16px 16px 0; position: sticky; top: 0; z-index: 50; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#6366F1,#10B981); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-title { color: #fff; font-weight: 800; font-size: 16px; }
  .logo-sub { color: #64748B; font-size: 10px; }

  /* MÊS */
  .month-nav { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 4px 6px; }
  .month-btn { background: none; border: none; color: #94A3B8; font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px; line-height: 1; }
  .month-label { color: #fff; font-weight: 700; font-size: 13px; min-width: 120px; text-align: center; cursor: pointer; background: none; border: none; }

  /* TABS */
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 1px; }
  .tab { background: transparent; color: #94A3B8; border: none; cursor: pointer; padding: 9px 12px; border-radius: 8px 8px 0 0; font-weight: 600; font-size: 11px; white-space: nowrap; }
  .tab.active { background: #fff; color: #1E293B; }

  /* CONTENT */
  .content { max-width: 680px; margin: 0 auto; padding: 16px 14px 80px; }

  /* CARDS KPI */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { border-radius: 12px; padding: 14px 16px; border-left: 4px solid; }
  .kpi.green { background: #F0FDF4; border-color: #10B981; }
  .kpi.red { background: #FFF5F5; border-color: #EF4444; }
  .kpi.amber { background: #FFFBEB; border-color: #F59E0B; }
  .kpi.blue { background: #EEF2FF; border-color: #6366F1; }
  .kpi-label { font-size: 10px; color: #64748B; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .kpi-value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kpi.green .kpi-value { color: #10B981; }
  .kpi.red .kpi-value { color: #EF4444; }
  .kpi.amber .kpi-value { color: #F59E0B; }
  .kpi.blue .kpi-value { color: #6366F1; }
  .kpi-sub { font-size: 10px; color: #94A3B8; margin-top: 2px; }

  /* SECTION CARD */
  .section-card { background: #fff; border-radius: 16px; border: 1px solid #F1F5F9; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.04); margin-bottom: 14px; }
  .section-header { padding: 14px 16px 10px; border-bottom: 1px solid #F8FAFC; display: flex; align-items: center; gap: 10px; }
  .section-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .section-title { font-weight: 700; font-size: 14px; color: #1E293B; }
  .section-sub { font-size: 11px; color: #94A3B8; margin-top: 1px; }
  .section-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-left: auto; }
  .add-btn { width: 30px; height: 30px; border-radius: 8px; border: none; cursor: pointer; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; margin-left: 6px; line-height: 1; flex-shrink: 0; }
  .progress-bar { height: 3px; background: #F1F5F9; }
  .progress-fill { height: 100%; border-radius: 0 2px 2px 0; transition: width .4s; }
  .items-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  /* ITEM */
  .item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: #fff; border-radius: 10px; border: 1px solid #F1F5F9; transition: all .15s; }
  .item.pago { background: #F8FAFC; border-color: #E2E8F0; opacity: 0.75; }
  .checkbox { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #CBD5E1; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; color: #fff; transition: all .15s; }
  .item-info { flex: 1; min-width: 0; }
  .item-nome { font-size: 14px; font-weight: 500; color: #334155; }
  .item.pago .item-nome { text-decoration: line-through; }
  .parcela-badge { display: inline-block; font-size: 11px; font-weight: 700; color: #92400E; background: #FEF3C7; border-radius: 99px; padding: 1px 7px; margin-top: 3px; }
  .parcela-info { font-size: 10px; color: #94A3B8; margin-left: 4px; }
  .item-valor { font-size: 14px; font-weight: 700; color: #1E293B; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .item.pago .item-valor { color: #94A3B8; }
  .item-actions { display: flex; gap: 4px; }
  .action-btn { background: none; border: none; cursor: pointer; padding: 4px; font-size: 14px; border-radius: 6px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid #F1F5F9; }
  .modal-title { font-weight: 700; font-size: 15px; color: #1E293B; }
  .modal-close { background: none; border: none; cursor: pointer; font-size: 20px; color: #94A3B8; }
  .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 12px; font-weight: 600; color: #64748B; display: block; margin-bottom: 5px; }
  input[type=text], input[type=number] { width: 100%; padding: 10px 14px; border: 1.5px solid #E2E8F0; border-radius: 10px; font-size: 14px; outline: none; font-family: inherit; }
  input:focus { border-color: #6366F1; }
  .parcela-row { display: flex; align-items: center; gap: 8px; }
  .parcela-row input { text-align: center; }
  .parcela-sep { font-size: 20px; font-weight: 700; color: #94A3B8; }
  .parcela-preview { margin-top: 6px; padding: 8px 12px; background: #FEF3C7; border-radius: 8px; font-size: 12px; color: #92400E; font-weight: 600; text-align: center; }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn-cancel { flex: 1; padding: 11px 0; border: 1.5px solid #E2E8F0; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 600; color: #64748B; }
  .btn-save { flex: 2; padding: 11px 0; border: none; border-radius: 10px; background: #6366F1; cursor: pointer; font-size: 14px; font-weight: 700; color: #fff; }

  /* MÊS PICKER */
  .month-picker { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
  .month-picker-inner { background: #1E293B; border-radius: 18px; padding: 20px; width: 290px; }
  .year-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .year-btn { background: rgba(255,255,255,0.08); border: none; cursor: pointer; color: #fff; width: 32px; height: 32px; border-radius: 8px; font-size: 16px; }
  .year-label { color: #fff; font-weight: 700; font-size: 16px; }
  .month-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .month-option { padding: 10px 0; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; background: rgba(255,255,255,0.06); color: #94A3B8; }
  .month-option.active { background: #6366F1; color: #fff; }
  .copy-btn { margin-top: 14px; width: 100%; padding: 11px 0; border-radius: 10px; border: none; cursor: pointer; background: rgba(99,102,241,0.15); color: #818CF8; font-weight: 600; font-size: 13px; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 99px; font-size: 12px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 300; white-space: nowrap; display: none; }
  .toast.show { display: block; }
  .toast.saved { background: #D1FAE5; color: #065F46; }
  .toast.saving { background: #FEF3C7; color: #92400E; }

  /* EMPTY */
  .empty { text-align: center; padding: 24px 0; color: #CBD5E1; font-size: 13px; }

  /* DASHBOARD BARS */
  .dash-card { background: #fff; border-radius: 16px; border: 1px solid #F1F5F9; padding: 18px; margin-bottom: 14px; }
  .dash-title { font-weight: 700; font-size: 14px; color: #1E293B; margin-bottom: 14px; }
  .bar-row { margin-bottom: 12px; }
  .bar-label-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .bar-label { font-size: 12px; font-weight: 600; color: #64748B; }
  .bar-val { font-size: 12px; font-weight: 700; color: #1E293B; }
  .bar-track { height: 8px; background: #F1F5F9; border-radius: 4px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }

  /* FAB */
  .fab { position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 50; line-height: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top" style="max-width:680px;margin:0 auto;">
    <div class="logo">
      <div class="logo-icon">💰</div>
      <div>
        <div class="logo-title">Minhas Finanças</div>
        <div class="logo-sub" id="month-sub">Mês atual</div>
      </div>
    </div>
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <button class="month-label" id="month-display" onclick="openMonthPicker()"></button>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div style="max-width:680px;margin:0 auto;">
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<div class="content" id="content"></div>

<button class="fab" id="fab" onclick="openAdd()" style="display:none;">+</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" style="display:none;" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Adicionar</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div>
        <label>NOME</label>
        <input type="text" id="f-nome" placeholder="Ex: Salário, Aluguel...">
      </div>
      <div>
        <label>VALOR (R$)</label>
        <input type="number" id="f-valor" placeholder="0,00" min="0" step="0.01">
      </div>
      <div id="f-parcela-wrap" style="display:none;">
        <label>PARCELA</label>
        <div class="parcela-row">
          <input type="number" id="f-parcela-atual" placeholder="Atual" min="1" oninput="updateParcelaPreview()">
          <span class="parcela-sep">/</span>
          <input type="number" id="f-parcela-total" placeholder="Total" min="1" oninput="updateParcelaPreview()">
        </div>
        <div class="parcela-preview" id="f-parcela-preview" style="display:none;"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveItem()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- MÊS PICKER -->
<div class="month-picker" id="month-picker" style="display:none;" onclick="closeMonthPicker(event)">
  <div class="month-picker-inner" onclick="event.stopPropagation()">
    <div class="year-nav">
      <button class="year-btn" onclick="pickerYear--; renderMonthPicker()">‹</button>
      <span class="year-label" id="picker-year"></span>
      <button class="year-btn" onclick="pickerYear++; renderMonthPicker()">›</button>
    </div>
    <div class="month-grid" id="month-grid"></div>
    <button class="copy-btn" onclick="copyFromPrev()">📋 Copiar estrutura do mês anterior</button>
  </div>
</div>

<script>
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const SECTIONS = [
  { key:"recebimentos", label:"Recebimentos",   emoji:"💚", accent:"#10B981", badgeBg:"#D1FAE5", badgeColor:"#065F46" },
  { key:"fixas",        label:"Desp. Fixas",    emoji:"📅", accent:"#6366F1", badgeBg:"#DBEAFE", badgeColor:"#1E40AF" },
  { key:"parceladas",   label:"Parceladas",     emoji:"🔢", accent:"#F59E0B", badgeBg:"#FEF3C7", badgeColor:"#92400E" },
  { key:"variaveis",    label:"Variáveis",      emoji:"💸", accent:"#EF4444", badgeBg:"#FEE2E2", badgeColor:"#991B1B" },
];

const now = new Date();
let curMonth = now.getMonth();
let curYear  = now.getFullYear();
let curTab   = "dashboard";
let pickerYear = curYear;
let editingId  = null;
let editingSec = null;

// ── Storage ──────────────────────────────────────────────────────────────────
function mkey(m, y) { return `fin_${y}_${String(m).padStart(2,"0")}`; }

function defaultData() {
  return {
    recebimentos: [
      {id:1,nome:"Salário",valor:5000,pago:false},
      {id:2,nome:"Freelance",valor:800,pago:false},
    ],
    fixas: [
      {id:1,nome:"Aluguel",valor:1500,pago:false},
      {id:2,nome:"Internet",valor:120,pago:false},
      {id:3,nome:"Plano de Saúde",valor:350,pago:false},
    ],
    parceladas: [
      {id:1,nome:"Notebook",valor:420,pago:false,parcelaAtual:6,parcelaTotal:12},
      {id:2,nome:"Geladeira",valor:280,pago:false,parcelaAtual:3,parcelaTotal:10},
    ],
    variaveis: [
      {id:1,nome:"Supermercado",valor:600,pago:false},
      {id:2,nome:"Gasolina",valor:200,pago:false},
      {id:3,nome:"Restaurante",valor:150,pago:false},
    ],
  };
}

function loadData(m, y) {
  try {
    const raw = localStorage.getItem(mkey(m,y));
    return raw ? JSON.parse(raw) : defaultData();
  } catch { return defaultData(); }
}

function saveData() {
  try {
    localStorage.setItem(mkey(curMonth, curYear), JSON.stringify(data));
    showToast("✓ Salvo", "saved");
  } catch { showToast("✓ Salvo", "saved"); }
}

let data = loadData(curMonth, curYear);

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast", 1500);
}

// ── Format ───────────────────────────────────────────────────────────────────
function fmt(v) { return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }

// ── Month ────────────────────────────────────────────────────────────────────
function updateMonthDisplay() {
  document.getElementById("month-display").textContent = `${MESES[curMonth]} ${curYear}`;
  const isNow = curMonth===now.getMonth() && curYear===now.getFullYear();
  const sub = document.getElementById("month-sub");
  sub.textContent = isNow ? "Mês atual" : "Visualizando outro mês";
  sub.style.color = isNow ? "#64748B" : "#F59E0B";
}

function changeMonth(dir) {
  curMonth += dir;
  if (curMonth < 0) { curMonth = 11; curYear--; }
  if (curMonth > 11) { curMonth = 0; curYear++; }
  data = loadData(curMonth, curYear);
  updateMonthDisplay();
  render();
}

function openMonthPicker() {
  pickerYear = curYear;
  renderMonthPicker();
  document.getElementById("month-picker").style.display = "flex";
}

function closeMonthPicker(e) {
  if (!e || e.target === document.getElementById("month-picker"))
    document.getElementById("month-picker").style.display = "none";
}

function renderMonthPicker() {
  document.getElementById("picker-year").textContent = pickerYear;
  const grid = document.getElementById("month-grid");
  grid.innerHTML = MESES.map((m,i) => {
    const active = i===curMonth && pickerYear===curYear ? "active" : "";
    return `<button class="month-option ${active}" onclick="selectMonth(${i},${pickerYear})">${m.slice(0,3)}</button>`;
  }).join("");
}

function selectMonth(m, y) {
  curMonth = m; curYear = y;
  data = loadData(m, y);
  updateMonthDisplay();
  closeMonthPicker({target:document.getElementById("month-picker")});
  render();
}

function copyFromPrev() {
  const pm = curMonth===0?11:curMonth-1;
  const py = curMonth===0?curYear-1:curYear;
  const prev = loadData(pm, py);
  data = {
    recebimentos: prev.recebimentos.map(i=>({...i,pago:false})),
    fixas:        prev.fixas.map(i=>({...i,pago:false})),
    parceladas:   prev.parceladas.map(i=>({...i,pago:false})),
    variaveis:    prev.variaveis.map(i=>({...i,pago:false})),
  };
  saveData();
  closeMonthPicker({target:document.getElementById("month-picker")});
  render();
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
function renderTabs() {
  const tabs = [
    {key:"dashboard", label:"Dashboard"},
    ...SECTIONS.map(s=>({key:s.key, label:s.label}))
  ];
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<button class="tab ${curTab===t.key?'active':''}" onclick="setTab('${t.key}')">${t.label}</button>`
  ).join("");
}

function setTab(key) {
  curTab = key;
  render();
}

// ── Dashboard ────────────────────────────────────────────────────────────────
function renderDashboard() {
  const totalRec  = data.recebimentos.reduce((s,i)=>s+i.valor,0);
  const totalFix  = data.fixas.reduce((s,i)=>s+i.valor,0);
  const totalPar  = data.parceladas.reduce((s,i)=>s+i.valor,0);
  const totalVar  = data.variaveis.reduce((s,i)=>s+i.valor,0);
  const totalDesp = totalFix+totalPar+totalVar;
  const saldo     = totalRec-totalDesp;
  const pagoRec   = data.recebimentos.filter(i=>i.pago).reduce((s,i)=>s+i.valor,0);
  const pagoDesp  = [...data.fixas,...data.parceladas,...data.variaveis].filter(i=>i.pago).reduce((s,i)=>s+i.valor,0);
  const pagoSaldo = pagoRec-pagoDesp;
  const maxBar    = Math.max(totalRec,totalFix,totalPar,totalVar,1);

  const bars = [
    {label:"Recebimentos",valor:totalRec,color:"#10B981"},
    {label:"Desp. Fixas",valor:totalFix,color:"#6366F1"},
    {label:"Parceladas",valor:totalPar,color:"#F59E0B"},
    {label:"Variáveis",valor:totalVar,color:"#EF4444"},
  ].map(d=>`
    <div class="bar-row">
      <div class="bar-label-row"><span class="bar-label">${d.label}</span><span class="bar-val">${fmt(d.valor)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.valor/maxBar*100).toFixed(1)}%;background:${d.color}"></div></div>
    </div>`).join("");

  return `
    <div class="kpi-grid">
      <div class="kpi green"><div class="kpi-label">Recebimentos</div><div class="kpi-value">${fmt(totalRec)}</div><div class="kpi-sub">Recebido: ${fmt(pagoRec)}</div></div>
      <div class="kpi red"><div class="kpi-label">Despesas</div><div class="kpi-value">${fmt(totalDesp)}</div><div class="kpi-sub">Pago: ${fmt(pagoDesp)}</div></div>
      <div class="kpi ${saldo>=0?'green':'red'}"><div class="kpi-label">Saldo Projetado</div><div class="kpi-value">${fmt(saldo)}</div><div class="kpi-sub">receitas − despesas</div></div>
      <div class="kpi ${pagoSaldo>=0?'green':'amber'}"><div class="kpi-label">Saldo Atual</div><div class="kpi-value">${fmt(pagoSaldo)}</div><div class="kpi-sub">recebido − pago</div></div>
    </div>
    <div class="dash-card">
      <div class="dash-title">Progresso Geral</div>
      ${bars}
    </div>`;
}

// ── Section ───────────────────────────────────────────────────────────────────
function renderSection(sec) {
  const items = data[sec.key];
  const total = items.reduce((s,i)=>s+i.valor,0);
  const pago  = items.filter(i=>i.pago).reduce((s,i)=>s+i.valor,0);
  const qtdP  = items.filter(i=>i.pago).length;
  const pct   = total>0 ? (pago/total*100).toFixed(1) : 0;

  const rows = items.length === 0
    ? `<div class="empty">Nenhum item. Toque em + para adicionar.</div>`
    : items.map(item => {
        const parcelaHTML = (item.parcelaAtual != null && item.parcelaTotal != null)
          ? `<span class="parcela-badge">${item.parcelaAtual}/${item.parcelaTotal}</span><span class="parcela-info">${item.parcelaTotal - item.parcelaAtual} restante${item.parcelaTotal-item.parcelaAtual!==1?'s':''}</span>`
          : "";
        return `
          <div class="item ${item.pago?'pago':''}" id="item-${sec.key}-${item.id}">
            <button class="checkbox" style="border-color:${item.pago?sec.accent:'#CBD5E1'};background:${item.pago?sec.accent:'transparent'}"
              onclick="toggleItem('${sec.key}',${item.id})">${item.pago?'✓':''}</button>
            <div class="item-info">
              <div class="item-nome">${item.nome}</div>
              ${parcelaHTML ? `<div style="margin-top:3px">${parcelaHTML}</div>` : ""}
            </div>
            <span class="item-valor">${fmt(item.valor)}</span>
            <div class="item-actions">
              <button class="action-btn" onclick="openEdit('${sec.key}',${item.id})" title="Editar">✏️</button>
              <button class="action-btn" onclick="deleteItem('${sec.key}',${item.id})" title="Excluir">🗑️</button>
            </div>
          </div>`;
      }).join("");

  return `
    <div class="section-card">
      <div class="section-header">
        <div class="section-icon" style="background:${sec.accent}18">${sec.emoji}</div>
        <div>
          <div class="section-title">${sec.label}</div>
          <div class="section-sub">${qtdP}/${items.length} concluídos · ${fmt(pago)} de ${fmt(total)}</div>
        </div>
        <span class="section-badge" style="background:${sec.badgeBg};color:${sec.badgeColor}">${fmt(total)}</span>
        <button class="add-btn" style="background:${sec.accent}" onclick="openAdd('${sec.key}')">+</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${sec.accent}"></div></div>
      <div class="items-list">${rows}</div>
    </div>`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  updateMonthDisplay();
  renderTabs();

  const fab = document.getElementById("fab");
  let html = "";

  if (curTab === "dashboard") {
    html = renderDashboard();
    fab.style.display = "none";
  } else {
    const sec = SECTIONS.find(s=>s.key===curTab);
    html = renderSection(sec);
    fab.style.background = sec.accent;
    fab.style.display = "flex";
    fab.onclick = () => openAdd(curTab);
  }

  document.getElementById("content").innerHTML = html;
}

// ── Toggle / Delete ───────────────────────────────────────────────────────────
function toggleItem(sec, id) {
  data[sec] = data[sec].map(i => i.id===id ? {...i, pago:!i.pago} : i);
  saveData();
  render();
}

function deleteItem(sec, id) {
  if (!confirm("Excluir este item?")) return;
  data[sec] = data[sec].filter(i => i.id!==id);
  saveData();
  render();
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openAdd(secKey) {
  editingId = null;
  editingSec = secKey || curTab;
  document.getElementById("modal-title").textContent = "Adicionar item";
  document.getElementById("f-nome").value = "";
  document.getElementById("f-valor").value = "";
  document.getElementById("f-parcela-atual").value = "";
  document.getElementById("f-parcela-total").value = "";
  document.getElementById("f-parcela-preview").style.display = "none";
  document.getElementById("f-parcela-wrap").style.display = editingSec==="parceladas" ? "block" : "none";
  document.getElementById("modal").style.display = "flex";
  setTimeout(() => document.getElementById("f-nome").focus(), 100);
}

function openEdit(secKey, id) {
  const item = data[secKey].find(i=>i.id===id);
  if (!item) return;
  editingId = id;
  editingSec = secKey;
  document.getElementById("modal-title").textContent = "Editar item";
  document.getElementById("f-nome").value = item.nome;
  document.getElementById("f-valor").value = item.valor;
  document.getElementById("f-parcela-atual").value = item.parcelaAtual ?? "";
  document.getElementById("f-parcela-total").value = item.parcelaTotal ?? "";
  document.getElementById("f-parcela-wrap").style.display = secKey==="parceladas" ? "block" : "none";
  updateParcelaPreview();
  document.getElementById("modal").style.display = "flex";
}

function closeModal(e) {
  if (!e || e.target===document.getElementById("modal"))
    document.getElementById("modal").style.display = "none";
}

function updateParcelaPreview() {
  const a = parseInt(document.getElementById("f-parcela-atual").value);
  const t = parseInt(document.getElementById("f-parcela-total").value);
  const prev = document.getElementById("f-parcela-preview");
  const nome = document.getElementById("f-nome").value || "Item";
  if (a && t) {
    prev.style.display = "block";
    prev.textContent = `${nome} · parcela ${a}/${t} · ${t-a} restante${t-a!==1?'s':''}`;
  } else {
    prev.style.display = "none";
  }
}

function saveItem() {
  const nome  = document.getElementById("f-nome").value.trim();
  const valor = parseFloat(document.getElementById("f-valor").value);
  if (!nome || isNaN(valor) || valor <= 0) { alert("Preencha nome e valor corretamente."); return; }

  const extra = {};
  if (editingSec === "parceladas") {
    const a = parseInt(document.getElementById("f-parcela-atual").value);
    const t = parseInt(document.getElementById("f-parcela-total").value);
    extra.parcelaAtual = a || null;
    extra.parcelaTotal = t || null;
  }

  if (editingId) {
    data[editingSec] = data[editingSec].map(i => i.id===editingId ? {...i, nome, valor, ...extra} : i);
  } else {
    const maxId = data[editingSec].length > 0 ? Math.max(...data[editingSec].map(i=>i.id)) : 0;
    data[editingSec].push({id: maxId+1, nome, valor, pago: false, ...extra});
  }

  saveData();
  document.getElementById("modal").style.display = "none";
  render();
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateMonthDisplay();
render();
</script>
</body>
</html>
